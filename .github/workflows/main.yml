name: Build and Release .deb Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update system
        run: sudo apt-get update && sudo apt update && sudo apt upgrade && sudo apt-get upgrade && sudo apt full-upgrade -y

      - name: Install dependencies
        run: sudo apt install -y dpkg-dev debhelper fakeroot

      - name: Install shc dependency
        run: sudo apt-get install -y shc

      - name: Prepare Package Structure
        run: |
          set -euo pipefail

          BUILD_DIR="$(mktemp -d)"

          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/man/man1

          # Create DEBIAN/control file
          cat <<EOF > pkg/DEBIAN/control
          Package: voidtools
          Version: 1.0.0
          Architecture: all
          Maintainer: Mahros AL-Qabasy <mahros.elqabasy@gmail.com>
          Description: A sample voidtools package with multiple scripts
          Depends: libc6 (>= 2.27)
          Section: misc
          Priority: optional
          EOF

          # Compile single-file tools. Only scripts/<tool>/<tool>.sh is an
          # entrypoint; helper scripts, installers, and tests are skipped.
          for script in scripts/*/*.sh; do
            tool="$(basename "$script" .sh)"

            if [ "$(basename "$(dirname "$script")")" != "$tool" ]; then
              echo "Skipping non-entrypoint script: $script"
              continue
            fi

            echo "Compiling $script"
            cp "$script" "$BUILD_DIR/$tool.sh"
            shc -f "$BUILD_DIR/$tool.sh" -o "pkg/usr/bin/$tool" -r
            chmod 0755 "pkg/usr/bin/$tool"
          done

          # vpg is a multi-file CLI: ship its library layout and link the
          # entrypoint into PATH the same way scripts/vpg/install.sh does.
          install -D -m 0755 scripts/vpg/vpg pkg/usr/lib/vpg/vpg
          install -D -m 0755 scripts/vpg/src/backup.sh pkg/usr/lib/vpg/src/backup.sh
          install -D -m 0755 scripts/vpg/src/restore.sh pkg/usr/lib/vpg/src/restore.sh
          ln -sfn ../lib/vpg/vpg pkg/usr/bin/vpg

          # Install and compress man pages for every section.
          for manpage in scripts/*/*.[1-9]; do
            [ -f "$manpage" ] || continue

            section="${manpage##*.}"
            name="$(basename "$manpage")"

            install -D -m 0644 "$manpage" "pkg/usr/share/man/man${section}/${name}"
            gzip -9nf "pkg/usr/share/man/man${section}/${name}"
          done

          echo "Package contents:"
          find pkg -mindepth 1 \( -type f -o -type l \) | LC_ALL=C sort

      - name: Build .deb Package
        run: dpkg-deb --build pkg voidtools.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidtools-deb
          path: voidtools.deb

  release:
    name: Create GitHub Release
    needs: build-deb
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Debian package artifact
        uses: actions/download-artifact@v4
        with:
          name: voidtools-deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: voidtools.deb
          tag_name: v1.0.0
          release_name: "Release v1.0.0"
          body: "🚀 New Debian package release: **v1.0.0**"
          draft: false
          prerelease: false
